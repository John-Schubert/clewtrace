# @file CT-DEV-002, CT-DEV-003, CT-DEV-004
# Configuration for `clew check --self`. Grammar and rules: docs/TRACEABILITY.md

[project]
requirements = ["model/requirements.sysml"]
id_pattern = "CT-(EFF|USE|TRC|MOD|XCH|CMP|SEC|PLT|DEV)-[0-9]{3}"
# Requirement coverage is enforced for requirements whose phase <= current_phase.
current_phase = 1

[coverage]
source_roots = ["crates", "app/src", "app/src-tauri", "scripts", ".github/workflows"]
languages = ["rust", "typescript", "svelte"]
file_level_allowed = ["*.toml", "*.yml", "*.yaml", "*.sh", "*.ps1"]
max_scope_lines = 200
# Requirements typed by these requirement definitions, or by ones that specialize them,
# need no parent in `clew report coverage`. Each entry is a qualified name.
top_level_definitions = ["ClewtraceRequirements::ProductRequirement"]

# Generated or vendored code may be excluded only with a reason and a requirement.
# JSON has no comments, so each JSON config file also gets an [[exclude]] entry.
[[exclude]]
path = "app/src-tauri/gen/**"
reason = "Schemas generated by tauri-build at build time; not committed"
requirement = "CT-PLT-001"

[[exclude]]
path = "app/src-tauri/tauri.conf.json"
reason = "Tauri app config: window, strict content security policy, no plugins. JSON has no comments"
requirement = "CT-SEC-001"

[[exclude]]
path = "app/src-tauri/tauri.release.conf.json"
reason = "Release-only Tauri config merged by the release workflow: installers, notices file, no WebView2 download. JSON has no comments"
requirement = "CT-DEV-014"

[[exclude]]
path = "app/src-tauri/capabilities/*.json"
reason = "Tauri capability files granting the UI its only commands. JSON has no comments"
requirement = "CT-SEC-001"

[[exclude]]
path = "app/src-tauri/icons/**"
reason = "App icons Tauri needs to build the window and installers. Binary assets and their SVG source"
requirement = "CT-PLT-001"

# A waiver records why a due requirement has no implementation or verification yet.
# [[waiver]]
# id = "CT-XXX-NNN"
# reason = "..."
# approved_by = "John Schubert"
# date = "2026-11-01"

# Proposed by Claude Code in task 1.9, not approved. John approves or drops each one.
[[waiver]]
id = "CT-EFF-001"
reason = "Verified by the release workflow, not by a test the gate can read: its Installer size step fails if any installer is over 20,000,000 bytes, and it passed for v0.1.0. Installers take too long to build in cargo test. Waived until John decides how a release workflow check counts as verification."
status = "proposed"
approved_by = ""
date = "2026-10-22"

[[waiver]]
id = "CT-PLT-001"
reason = "Verified by the release workflow, not by a test the gate can read: its build job fails if an MSI, DMG, deb, or rpm is missing, and it passed for v0.1.0. ARM64 installers are not built yet. Waived until John decides how a release workflow check counts as verification."
status = "proposed"
approved_by = ""
date = "2026-10-22"
