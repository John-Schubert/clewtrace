# @file CT-DEV-009
# Core library: parse, scan, index, trace, io, audit, and license modules.

[package]
name = "clew-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tree-sitter = { version = "0.27.1", default-features = false }
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
sha2 = { version = "0.10.9", default-features = false }

# OS file events for watching a project folder in the app (task 2.10b). Linux and macOS only:
# notify's Windows watcher wakes every 100 ms, so Windows uses windows-sys (task 2.10c,
# CT-EFF-008). macos_fsevent keeps FSEvents as the macOS watcher; without it notify falls
# back to polling there.
[target.'cfg(not(windows))'.dependencies]
notify = { version = "8.2.1", default-features = false, features = ["macos_fsevent"] }


# The Windows file watcher (task 2.10c): ReadDirectoryChangesW with a wait that has no
# timeout (CT-EFF-008). The same version tauri already brings in; only the features the
# watcher calls need. Win32_Security is there because CreateFileW and CreateEventW take a
# SECURITY_ATTRIBUTES pointer, which is always null here.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }
