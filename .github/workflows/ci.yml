# @file CT-DEV-004, CT-DEV-005, CT-DEV-008, CT-DEV-014, CT-PLT-001, CT-EFF-009
# CI gate on Ubuntu, Windows, and macOS: builds the desktop app (UI and Tauri crate), then
# format, lint, tests, the trace gate, the license notices check, the commit hook, and (on
# Ubuntu) commit trailers, cargo-deny, and the performance budgets on 4 GB and 2 CPUs.
# Installers are built by the release workflow. Rules: docs/TRACEABILITY.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v7.0.1, pinned by commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/cache v6.1.0, pinned by commit. Caches the cargo registry and target/
      # (ADR-0001). A new Cargo.lock or toolchain starts from the last cache for this OS.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # The web view and GTK libraries Tauri links on Linux (same list as README.md).
      - name: Tauri Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Node.js comes with the runner image. Vite 7 needs 20.19 or newer.
      - name: UI install
        working-directory: app
        run: |
          node --version
          npm ci --no-audit --no-fund

      - name: UI check
        working-directory: app
        run: npm run check

      # The Tauri crate embeds app/dist, so the UI is built before any cargo step.
      - name: UI build
        working-directory: app
        run: npm run build

      # rustup on the runner installs the toolchain pinned in rust-toolchain.toml.
      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Desktop app build
        run: cargo build --locked -p clewtrace

      - name: Trace gate
        run: cargo run --locked -p clew-cli -- check --self

      # npm production packages against the shipped license tier, dev packages against the
      # build-only tier, and deps.toml scopes against what ships (ADR-0003, CT-DEV-014).
      - name: Notices and npm licenses
        run: cargo run --locked -p clew-cli -- notices

      - name: Commit trailers
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            git log --format=%B -n1 "$sha" > "$RUNNER_TEMP/msg.txt"
            echo "commit $sha"
            ./target/debug/clew check-commit "$RUNNER_TEMP/msg.txt" || failed=1
          done
          exit $failed

      # Last, because it makes test commits in the checkout.
      - name: Commit hook (sh)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh scripts/install-hooks.sh
          export CLEW="$PWD/target/debug/clew"
          git config user.name "CI"
          git config user.email "ci@invalid"
          if git commit --allow-empty -m "Test commit without a trailer"; then
            echo "hook allowed a commit without a Refs: trailer"; exit 1
          fi
          git commit --allow-empty -m "Test commit with a trailer" -m "Refs: CT-DEV-005"

      - name: Commit hook (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install-hooks.ps1
          if ($LASTEXITCODE -ne 0) { throw 'install-hooks.ps1 failed' }
          $env:CLEW = (Join-Path $PWD 'target\debug\clew.exe') -replace '\\', '/'
          git config user.name "CI"
          git config user.email "ci@invalid"
          git commit --allow-empty -m "Test commit without a trailer"
          if ($LASTEXITCODE -eq 0) { throw 'hook allowed a commit without a Refs: trailer' }
          git commit --allow-empty -m "Test commit with a trailer" -m "Refs: CT-DEV-005"
          if ($LASTEXITCODE -ne 0) { throw 'hook blocked a commit with a Refs: trailer' }
          exit 0

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    env:
      DENY_VERSION: 0.20.2
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # John's policy (deny.toml): GPL, AGPL, LGPL, and SSPL are never allowed.
      - name: Forbidden licenses
        run: |
          if grep -v '^[[:space:]]*#' deny.toml | grep -E 'GPL|SSPL'; then
            echo "deny.toml must never allow GPL, AGPL, LGPL, or SSPL licenses" >&2
            exit 1
          fi

      # The release binary, checked against a pinned SHA-256.
      - name: Install cargo-deny
        run: |
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$name.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/deny.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      - name: Licenses, advisories, bans, and sources
        run: cargo deny --locked check

  # CT-EFF-009: the performance tests on the reference machine, 4 GB of RAM with no swap and
  # 2 CPUs. systemd-run puts them in their own cgroup with those limits, the kernel feature
  # containers are built on, so no container image is needed. They fail when a CT-EFF budget
  # whose phase has started is exceeded (crates/clew-core/tests/perf.rs).
  perf:
    name: perf (4 GB, 2 CPUs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-perf-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-perf-${{ runner.os }}-

      # Built outside the limits, in release mode like the shipped binaries.
      - name: Build the performance tests
        run: |
          cargo test --locked --release -p clew-core --test perf --no-run --message-format=json \
            | grep -o '"executable":"[^"]*"' | grep '/perf-' | cut -d'"' -f4 > "$RUNNER_TEMP/perf-bin"
          test -x "$(cat "$RUNNER_TEMP/perf-bin")"

      # The test prints each budget, what it measured, and whether it is due. systemd-run runs
      # as root under the system manager: a user manager (--user) may lack the memory and
      # cpuset controllers and drop the limits without an error. `limited` reads the limits
      # back from its own cgroup and stops if any is missing. Then a canary writes 5 GiB under
      # the same limits and must be killed (exit 137, SIGKILL), or the job fails.
      - name: Performance budgets
        run: |
          bin=$(cat "$RUNNER_TEMP/perf-bin")
          limited() {
            sudo systemd-run --scope --quiet \
              -p MemoryMax=4G -p MemorySwapMax=0 -p AllowedCPUs=0-1 \
              -- sh -c '
                cg="/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)"
                max=$(cat "$cg/memory.max") swap=$(cat "$cg/memory.swap.max")
                echo "memory.max $max bytes, memory.swap.max $swap, $(nproc) CPUs"
                if [ "$max" != 4294967296 ] || [ "$swap" != 0 ] || [ "$(nproc)" != 2 ]; then
                  echo "the 4 GB, no swap, and 2 CPU limits are not applied" >&2; exit 1
                fi
                exec "$@"
              ' sh "$@"
          }
          limited "$bin" --ignored --nocapture --skip canary
          status=0
          limited env CLEW_PERF_CANARY=1 "$bin" --ignored --nocapture \
            --exact canary_writes_more_than_the_memory_limit || status=$?
          if [ "$status" != 137 ]; then
            echo "the 5 GiB canary exited with $status instead of being killed, so the 4 GB limit is not enforced" >&2
            exit 1
          fi
          echo "the 5 GiB canary was killed: the 4 GB limit is enforced"
