# @file CT-DEV-003, CT-DEV-004, CT-DEV-005, CT-DEV-008, CT-DEV-014, CT-PLT-001, CT-EFF-009, CT-EFF-001, CT-EFF-002, CT-EFF-003
# CI gate on Ubuntu, Windows, and macOS: builds the desktop app (UI and Tauri crate), then
# format, lint, tests, the trace gate, the license notices check, the commit hook, and (on
# Ubuntu) commit trailers, cargo-deny, the performance budgets on 4 GB and 2 CPUs, the test
# coverage minimum, and the 20 MB installer size check on the release image. The app's own
# start time and idle memory are measured on Ubuntu inside the perf limits (under xvfb), and
# idle memory on Windows and macOS in the app-idle-memory job.
# The trace gate fails on untraced lines, unknown IDs, and requirements from a finished
# phase with no implementation, verification, or waiver (current-phase gaps are warnings).
# Release installers are built by the release workflow; the installer-size job builds the
# Linux deb on every pull request. Rules: docs/TRACEABILITY.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAURI_APT_PACKAGES: >-
        libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev
        libayatana-appindicator3-dev librsvg2-dev
    steps:
      # actions/checkout v7.0.1, pinned by commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/cache v6.1.0, pinned by commit. Caches the cargo registry and target/
      # (ADR-0001). A new Cargo.lock or toolchain starts from the last cache for this OS.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # The web view and GTK libraries Tauri links on Linux (same list as README.md).
      # The .deb files are kept in a folder under $HOME (actions/cache cannot write to the
      # root-owned /var/cache/apt/archives) and cached by runner image and package list.
      # apt-get update still runs, so apt only reuses a cached file whose version matches.
      # The timeout makes a slow mirror fail in minutes, not after half an hour.
      - name: Tauri Linux packages cache key
        id: apt
        if: runner.os == 'Linux'
        run: echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Tauri Linux packages cache
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/apt-archives
          key: apt-${{ steps.apt.outputs.image }}-${{ env.TAURI_APT_PACKAGES }}

      - name: Tauri Linux packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::archives="$HOME/apt-archives" \
            -o APT::Sandbox::User=root -o APT::Keep-Downloaded-Packages=true \
            $TAURI_APT_PACKAGES
          sudo chown -R "$USER" "$HOME/apt-archives"

      # Node.js comes with the runner image. Vite 7 needs 20.19 or newer.
      - name: UI install
        working-directory: app
        run: |
          node --version
          npm ci --no-audit --no-fund

      - name: UI check
        working-directory: app
        run: npm run check

      # @verifies CT-USE-002, CT-USE-005, CT-EFF-005, CT-SEC-003
      - name: UI tests
        working-directory: app
        run: npm test

      # The Tauri crate embeds app/dist, so the UI is built before any cargo step.
      - name: UI build
        working-directory: app
        run: npm run build

      # rustup on the runner installs the toolchain pinned in rust-toolchain.toml.
      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # The perf-probe feature is off in every other step and in release builds. This builds,
      # lints, and tests it so the probes cannot rot between the runs of the perf job.
      - name: Perf probe lint and tests
        run: |
          cargo clippy --locked -p clewtrace --all-targets --features perf-probe -- -D warnings
          cargo test --locked -p clewtrace --features perf-probe

      - name: Desktop app build
        run: cargo build --locked -p clewtrace

      - name: Trace gate
        run: cargo run --locked -p clew-cli -- check --self

      # npm production packages against the shipped license tier, dev packages against the
      # build-only tier, and deps.toml scopes against what ships (ADR-0003, CT-DEV-014).
      - name: Notices and npm licenses
        run: cargo run --locked -p clew-cli -- notices

      - name: Commit trailers
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            git log --format=%B -n1 "$sha" > "$RUNNER_TEMP/msg.txt"
            echo "commit $sha"
            ./target/debug/clew check-commit "$RUNNER_TEMP/msg.txt" || failed=1
          done
          exit $failed

      # Last, because it makes test commits in the checkout.
      - name: Commit hook (sh)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh scripts/install-hooks.sh
          export CLEW="$PWD/target/debug/clew"
          git config user.name "CI"
          git config user.email "ci@invalid"
          if git commit --allow-empty -m "Test commit without a trailer"; then
            echo "hook allowed a commit without a Refs: trailer"; exit 1
          fi
          git commit --allow-empty -m "Test commit with a trailer" -m "Refs: CT-DEV-005"

      - name: Commit hook (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install-hooks.ps1
          if ($LASTEXITCODE -ne 0) { throw 'install-hooks.ps1 failed' }
          $env:CLEW = (Join-Path $PWD 'target\debug\clew.exe') -replace '\\', '/'
          git config user.name "CI"
          git config user.email "ci@invalid"
          git commit --allow-empty -m "Test commit without a trailer"
          if ($LASTEXITCODE -eq 0) { throw 'hook allowed a commit without a Refs: trailer' }
          git commit --allow-empty -m "Test commit with a trailer" -m "Refs: CT-DEV-005"
          if ($LASTEXITCODE -ne 0) { throw 'hook blocked a commit with a Refs: trailer' }
          exit 0

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    env:
      DENY_VERSION: 0.20.2
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # John's policy (deny.toml): GPL, AGPL, LGPL, and SSPL are never allowed.
      - name: Forbidden licenses
        run: |
          if grep -v '^[[:space:]]*#' deny.toml | grep -E 'GPL|SSPL'; then
            echo "deny.toml must never allow GPL, AGPL, LGPL, or SSPL licenses" >&2
            exit 1
          fi

      # The release binary, checked against a pinned SHA-256.
      - name: Install cargo-deny
        run: |
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$name.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/deny.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      - name: Licenses, advisories, bans, and sources
        run: cargo deny --locked check

  # CT-EFF-009: the performance tests on the reference machine, 4 GB of RAM with no swap and
  # 2 CPUs. systemd-run puts them in their own cgroup with those limits, the kernel feature
  # containers are built on, so no container image is needed. They fail when a CT-EFF budget
  # whose phase has started is exceeded (crates/clew-core/tests/perf.rs).
  perf:
    name: perf (4 GB, 2 CPUs)
    runs-on: ubuntu-latest
    env:
      TAURI_APT_PACKAGES: >-
        libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev
        libayatana-appindicator3-dev librsvg2-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-perf-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-perf-${{ runner.os }}-

      # Built outside the limits, in release mode like the shipped binaries.
      - name: Build the performance tests
        run: |
          cargo test --locked --release -p clew-core --test perf --no-run --message-format=json \
            | grep -o '"executable":"[^"]*"' | grep '/perf-' | cut -d'"' -f4 > "$RUNNER_TEMP/perf-bin"
          test -x "$(cat "$RUNNER_TEMP/perf-bin")"

      # The test prints each budget, what it measured, and whether it is due. systemd-run runs
      # as root under the system manager: a user manager (--user) may lack the memory and
      # cpuset controllers and drop the limits without an error. `limited` reads the limits
      # back from its own cgroup and stops if any is missing. Then a canary writes 5 GiB under
      # the same limits and must be killed (exit 137, SIGKILL), or the job fails.
      - name: Performance budgets
        run: |
          bin=$(cat "$RUNNER_TEMP/perf-bin")
          limited() {
            sudo systemd-run --scope --quiet \
              -p MemoryMax=4G -p MemorySwapMax=0 -p AllowedCPUs=0-1 \
              -- sh -c '
                cg="/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)"
                max=$(cat "$cg/memory.max") swap=$(cat "$cg/memory.swap.max")
                echo "memory.max $max bytes, memory.swap.max $swap, $(nproc) CPUs"
                if [ "$max" != 4294967296 ] || [ "$swap" != 0 ] || [ "$(nproc)" != 2 ]; then
                  echo "the 4 GB, no swap, and 2 CPU limits are not applied" >&2; exit 1
                fi
                exec "$@"
              ' sh "$@"
          }
          limited "$bin" --ignored --nocapture --skip canary
          status=0
          limited env CLEW_PERF_CANARY=1 "$bin" --ignored --nocapture \
            --exact canary_writes_more_than_the_memory_limit || status=$?
          if [ "$status" != 137 ]; then
            echo "the 5 GiB canary exited with $status instead of being killed, so the 4 GB limit is not enforced" >&2
            exit 1
          fi
          echo "the 5 GiB canary was killed: the 4 GB limit is enforced"

      # CT-EFF-002, CT-EFF-003: the app measures its own start time and idle memory (probe.rs,
      # built with the perf-probe feature). xvfb gives it a display; it runs inside the
      # systemd-run scope because sudo drops DISPLAY, so a display started outside would
      # not reach it. Built outside the limits, like the core perf tests. Windows and macOS
      # memory is measured by the app-idle-memory job. xvfb is a CI tool and does not ship.
      - name: Tauri Linux packages and xvfb
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y $TAURI_APT_PACKAGES xvfb xauth

      - name: UI build
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build the app probe test
        run: |
          cargo test --locked --release -p clewtrace --features perf-probe --test perf_probe --no-run --message-format=json \
            | grep -o '"executable":"[^"]*"' | grep '/perf_probe-' | cut -d'"' -f4 > "$RUNNER_TEMP/probe-bin"
          test -x "$(cat "$RUNNER_TEMP/probe-bin")"

      - name: App start time and idle memory
        run: |
          bin=$(cat "$RUNNER_TEMP/probe-bin")
          sudo systemd-run --scope --quiet \
            -p MemoryMax=4G -p MemorySwapMax=0 -p AllowedCPUs=0-1 \
            -- xvfb-run -a --server-args="-screen 0 1280x800x24" \
            "$bin" --ignored --nocapture

  # CT-EFF-002: idle memory of the shipped build on Windows and macOS, read from a workflow
  # step so no new crate is needed. The build is the release build without installers and
  # without the perf-probe feature. The step starts the app with no project, waits for it to
  # settle, and sums the resident memory of the app and its web view processes. Fails over
  # 200 MB, or when no web view process is found (which would undercount).
  app-idle-memory:
    name: app idle memory (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-idle-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-idle-${{ runner.os }}-

      - name: UI install and build
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # The Tauri CLI adds the custom-protocol feature, so the binary loads the embedded UI.
      - name: Release build
        working-directory: app
        run: npm run tauri build -- --ci --no-bundle

      # Fails (exit 1) over 200 MB or with no web view process counted.
      # @verifies CT-EFF-002
      - name: Idle memory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "target\release\clewtrace.exe" -PassThru
          Start-Sleep -Seconds 10
          $all = Get-CimInstance Win32_Process
          $ids = [System.Collections.Generic.HashSet[int]]::new()
          [void]$ids.Add($app.Id)
          do {
            $before = $ids.Count
            foreach ($p in $all) { if ($ids.Contains([int]$p.ParentProcessId)) { [void]$ids.Add([int]$p.ProcessId) } }
          } while ($ids.Count -ne $before)
          $mine = $all | Where-Object { $ids.Contains([int]$_.ProcessId) }
          $mine | ForEach-Object { "{0,6} {1,-24} {2,8:N0} KB" -f $_.ProcessId, $_.Name, ($_.WorkingSetSize / 1KB) }
          $webview = @($mine | Where-Object { $_.Name -eq "msedgewebview2.exe" }).Count
          $total = ($mine | Measure-Object -Property WorkingSetSize -Sum).Sum
          Stop-Process -Id $app.Id -Force
          "idle memory: {0:N0} MB in {1} processes ({2} web view)" -f ($total / 1e6), $mine.Count, $webview
          if ($webview -eq 0) { Write-Error "No msedgewebview2 process under the app, so the total is too low."; exit 1 }
          if ($total -gt 200e6) { Write-Error "CT-EFF-002: idle memory is over 200 MB."; exit 1 }

      # Fails (exit 1) over 200 MB or with no web view process counted. WKWebView runs its
      # processes outside the app's process tree, so they are summed by name; a runner with
      # no other web content has only the app's.
      # @verifies CT-EFF-002
      - name: Idle memory (macOS)
        if: runner.os == 'macOS'
        run: |
          target/release/clewtrace &
          pid=$!
          sleep 10
          app_kb=$(ps -o rss= -p "$pid")
          web=$(ps -axo rss=,comm= | grep -E 'com\.apple\.WebKit\.(WebContent|Networking|GPU)' || true)
          echo "$web"
          web_kb=$(echo "$web" | awk '{s+=$1} END{print s+0}')
          kill "$pid"
          total=$(( (app_kb + web_kb) * 1024 ))
          echo "idle memory: $(( total / 1000000 )) MB (app $app_kb KB, web view $web_kb KB)"
          if [ "$web_kb" -eq 0 ]; then echo "No WebKit process found, so the total is too low." >&2; exit 1; fi
          if [ "$total" -gt 200000000 ]; then echo "CT-EFF-002: idle memory is over 200 MB." >&2; exit 1; fi

  # Test coverage of clew-core and clew-cli, measured by cargo-llvm-cov. The job prints the
  # total line coverage, writes it with a per-file table to the job summary, and fails when
  # the total is under the minimum (docs/TRACEABILITY.md). The minimum only goes up: John
  # raises it at each gate. John adds this job to the "CI must pass" ruleset.
  # The desktop app crate (app/src-tauri) is measured in a separate run and reported only,
  # until Gate 2 sets its minimum. It never changes the core result.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      LLVM_COV_VERSION: 0.9.1
      MIN_LINE_COVERAGE: 95
      TAURI_APT_PACKAGES: >-
        libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev
        libayatana-appindicator3-dev librsvg2-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # The cargo registry, target/, and the cargo-llvm-cov binary. Instrumented builds go
      # to target/llvm-cov-target, apart from the other jobs' builds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-llvm-cov
            target
          key: cargo-cov-${{ runner.os }}-${{ env.LLVM_COV_VERSION }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-cov-${{ runner.os }}-${{ env.LLVM_COV_VERSION }}-

      # The exact version from crates.io with its own Cargo.lock, unless the cache has it.
      - name: Install cargo-llvm-cov
        run: |
          rustup component add llvm-tools-preview
          if ! cargo llvm-cov --version 2>/dev/null | grep -qx "cargo-llvm-cov $LLVM_COV_VERSION"; then
            cargo install cargo-llvm-cov --locked --version "$LLVM_COV_VERSION" --force
          fi
          cargo llvm-cov --version

      # bash with pipefail, so a failed test run still fails the step through tee.
      - name: Test coverage
        shell: bash
        run: |
          status=0
          cargo llvm-cov --locked -p clew-core -p clew-cli --summary-only \
            --fail-under-lines "$MIN_LINE_COVERAGE" | tee "$RUNNER_TEMP/coverage.txt" || status=$?
          lines=$(awk '$1 == "TOTAL" { print $10 }' "$RUNNER_TEMP/coverage.txt")
          echo "Total line coverage (clew-core and clew-cli): ${lines:-unknown}"
          {
            echo "## Test coverage"
            echo
            echo "Total line coverage of clew-core and clew-cli: **${lines:-unknown}**."
            echo "Measured by cargo-llvm-cov $LLVM_COV_VERSION. Minimum: ${MIN_LINE_COVERAGE}% of lines."
            echo
            echo '```'
            grep -E '^(Filename|-{10}|clew-|TOTAL)' "$RUNNER_TEMP/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # The app crate links the web view libraries and embeds app/dist, as in the check job.
      - name: Tauri Linux packages
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y $TAURI_APT_PACKAGES

      - name: UI build
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Report only until Gate 2: a low number or a failed run does not fail the job.
      - name: App test coverage (report only)
        continue-on-error: true
        shell: bash
        run: |
          cargo llvm-cov --locked -p clewtrace --summary-only --ignore-filename-regex '/crates/' | tee "$RUNNER_TEMP/app-coverage.txt"
          lines=$(awk '$1 == "TOTAL" { print $10 }' "$RUNNER_TEMP/app-coverage.txt")
          echo "Total line coverage (app/src-tauri, report only): ${lines:-unknown}"
          {
            echo "## App test coverage (report only)"
            echo
            echo "Total line coverage of the clewtrace app crate (app/src-tauri): **${lines:-unknown}**."
            echo "No minimum until Gate 2."
            echo
            echo '```'
            grep -E '^(Filename|-{10}|[A-Za-z_]+\.rs |TOTAL)' "$RUNNER_TEMP/app-coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # CT-EFF-001: the Linux deb is built on every pull request, on the release image (Ubuntu
  # 22.04) with the release config and the notices file, so a size regression shows up
  # before a release tag. It uses the same 20 MB check as release.yml. John adds this job to
  # the "CI must pass" ruleset.
  installer-size:
    name: installer-size
    runs-on: ubuntu-22.04
    env:
      TAURI_APT_PACKAGES: >-
        libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev
        libayatana-appindicator3-dev librsvg2-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-size-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-size-${{ runner.os }}-

      # The web view and GTK libraries Tauri links on Linux (same list as release.yml).
      # The .deb files are kept in a folder under $HOME (actions/cache cannot write to the
      # root-owned /var/cache/apt/archives) and cached by runner image and package list.
      # apt-get update still runs, so apt only reuses a cached file whose version matches.
      # The timeout makes a slow mirror fail in minutes, not after half an hour.
      - name: Tauri Linux packages cache key
        id: apt
        if: runner.os == 'Linux'
        run: echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Tauri Linux packages cache
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/apt-archives
          key: apt-${{ steps.apt.outputs.image }}-${{ env.TAURI_APT_PACKAGES }}

      - name: Tauri Linux packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::archives="$HOME/apt-archives" \
            -o APT::Sandbox::User=root -o APT::Keep-Downloaded-Packages=true \
            $TAURI_APT_PACKAGES
          sudo chown -R "$USER" "$HOME/apt-archives"

      - name: UI install
        working-directory: app
        run: npm ci --no-audit --no-fund

      # Writes target/notices/THIRD-PARTY-NOTICES.txt, which tauri.release.conf.json bundles.
      - name: Notices
        run: cargo run --locked -p clew-cli -- notices --out target/notices

      - name: Installer
        working-directory: app
        run: |
          npm run tauri build -- --ci --bundles deb \
            --config src-tauri/tauri.release.conf.json

      # CT-EFF-001: the deb is 20 MB (20,000,000 bytes) or smaller. Exits 1 if it is larger
      # or was not built, so the pull request fails.
      # @verifies CT-EFF-001
      - name: Installer size
        run: |
          failed=0
          found=0
          for f in $(find target -path '*/release/bundle/deb/*' -type f -name '*.deb'); do
            found=1
            size=$(wc -c < "$f" | tr -d ' ')
            echo "$f: $size bytes"
            if [ "$size" -gt 20000000 ]; then
              echo "::error::$f is $size bytes, over the 20 MB budget (CT-EFF-001)"
              failed=1
            fi
          done
          if [ "$found" = 0 ]; then
            echo "::error::no .deb installer was built"
            failed=1
          fi
          exit $failed
