# @file CT-EFF-002, CT-EFF-003, CT-EFF-010
# Task 2.5b, temporary: measures web view settings against the 2.5 probes on all three
# operating systems. Each job builds the app once, then launches it 3 times per variant and
# prints one summary table. It runs on each push of this file, 3 pushes (3 CI runs)
# before a budget is set. Run counter: 3
# Removed from the branch when the results are recorded in docs/PLAN.md.
name: budget-experiments

on:
  workflow_dispatch:
  push:
    branches: [claude/intelligent-goldberg-7xhdkj]
    paths: [.github/workflows/budget-experiments.yml]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: experiments (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      TAURI_APT_PACKAGES: >-
        libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev
        libayatana-appindicator3-dev librsvg2-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-perf-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-perf-${{ runner.os }}-

      - name: Tauri Linux packages and xvfb
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y $TAURI_APT_PACKAGES xvfb xauth

      - name: UI build
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build the app probe test
        run: |
          cargo test --locked --release -p clewtrace --features perf-probe --test perf_probe --no-run --message-format=json \
            | grep -o '"executable":"[^"]*"' | grep '/perf_probe-' | cut -d'"' -f4 > "$RUNNER_TEMP/probe-bin"
          test -x "$(cat "$RUNNER_TEMP/probe-bin")"

      - name: Variants
        run: |
          bin=$(cat "$RUNNER_TEMP/probe-bin")
          variants=(
            "baseline|"
            "no-compositing|WEBKIT_DISABLE_COMPOSITING_MODE=1"
            "no-dmabuf|WEBKIT_DISABLE_DMABUF_RENDERER=1"
            "software-gl|LIBGL_ALWAYS_SOFTWARE=1"
            "no-compositing+no-dmabuf|WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1"
          )
          echo "| variant | run | interactive ms | total PSS MB | app PSS MB | processes |" > table.md
          echo "|---|---|---|---|---|---|" >> table.md
          for v in "${variants[@]}"; do
            name=${v%%|*}; vars=${v#*|}
            for run in 1 2 3; do
              out=$(sudo systemd-run --scope --quiet \
                -p MemoryMax=4G -p MemorySwapMax=0 -p AllowedCPUs=0-1 \
                -- env $vars xvfb-run -a --server-args="-screen 0 1280x800x24" \
                "$bin" --ignored --nocapture 2>&1 || true)
              line=$(echo "$out" | grep '^{"time_to_interactive_ms"' | tail -1)
              if [ -z "$line" ]; then echo "| $name | $run | failed | | | |" >> table.md; echo "$out" | tail -20; continue; fi
              echo "$line" | jq -r --arg n "$name" --arg r "$run" \
                '"| \($n) | \($r) | \(.time_to_interactive_ms) | \(.idle_memory.pss_total_bytes/1e6|floor) | \(.idle_memory.app_pss_bytes/1e6|floor) | \(.idle_memory.processes|length) |"' >> table.md
            done
          done
          cat table.md
          cat table.md >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: experiments (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-idle-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-idle-${{ runner.os }}-

      - name: UI install and build
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Release build
        working-directory: app
        run: npm run tauri build -- --ci --no-bundle

      # The same measurement as ci.yml: private working set of the app and its children.
      - name: Variants
        shell: pwsh
        run: |
          $variants = [ordered]@{
            "baseline"                        = ""
            "renderer-limit-1"                = "--renderer-process-limit=1"
            "disable-gpu"                     = "--disable-gpu"
            "in-process-gpu"                  = "--in-process-gpu"
            "disable-gpu+renderer-limit-1"    = "--disable-gpu --renderer-process-limit=1"
            "fewer-features"                  = "--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection,msEdgeSmartScreen,Translate,OptimizationHints"
          }
          $rows = @("| variant | run | total private MB | app private MB | processes |", "|---|---|---|---|---|")
          foreach ($name in $variants.Keys) {
            foreach ($run in 1..3) {
              if ($variants[$name]) { $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = $variants[$name] } else { Remove-Item Env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS -ErrorAction SilentlyContinue }
              $app = Start-Process -FilePath "target\release\clewtrace.exe" -PassThru
              Start-Sleep -Seconds 10
              $all = Get-CimInstance Win32_Process
              $ids = [System.Collections.Generic.HashSet[int]]::new()
              [void]$ids.Add($app.Id)
              do {
                $before = $ids.Count
                foreach ($p in $all) { if ($ids.Contains([int]$p.ParentProcessId)) { [void]$ids.Add([int]$p.ProcessId) } }
              } while ($ids.Count -ne $before)
              $private = @{}
              Get-CimInstance Win32_PerfFormattedData_PerfProc_Process | ForEach-Object { $private[[int]$_.IDProcess] = $_.WorkingSetPrivate }
              $procs = @($all | Where-Object { $ids.Contains([int]$_.ProcessId) })
              Stop-Process -Id $app.Id -Force
              Start-Sleep -Seconds 2
              $total = ($procs | ForEach-Object { $private[[int]$_.ProcessId] } | Measure-Object -Sum).Sum
              $appPrivate = $private[[int]$app.Id]
              $rows += "| {0} | {1} | {2:N0} | {3:N0} | {4} |" -f $name, $run, ($total / 1e6), ($appPrivate / 1e6), $procs.Count
            }
          }
          $rows | ForEach-Object { $_ }
          $rows | Add-Content -Path $env:GITHUB_STEP_SUMMARY

  macos:
    name: experiments (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-idle-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-idle-${{ runner.os }}-

      - name: UI install and build
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Release build
        working-directory: app
        run: npm run tauri build -- --ci --no-bundle

      # WKWebView has no setting reachable without a new crate, so this only measures the
      # baseline three times.
      - name: Baseline
        run: |
          echo "| variant | run | total MB | app MB | web view MB |" > table.md
          echo "|---|---|---|---|---|" >> table.md
          for run in 1 2 3; do
            target/release/clewtrace &
            pid=$!
            echo "WebKit processes before settle: $(ps -axo comm= | grep -cE 'com\.apple\.WebKit\.' || true)"
            sleep 10
            app_kb=$(ps -o rss= -p "$pid")
            web_kb=$(ps -axo rss=,comm= | grep -E 'com\.apple\.WebKit\.(WebContent|Networking|GPU)' | awk '{s+=$1} END{print s+0}')
            kill "$pid"
            for i in $(seq 1 30); do
              ps -axo comm= | grep -qE 'com\.apple\.WebKit\.(WebContent|Networking|GPU)' || break
              sleep 1
            done
            echo "| baseline | $run | $(( (app_kb + web_kb) / 1000 )) | $(( app_kb / 1000 )) | $(( web_kb / 1000 )) |" >> table.md
          done
          cat table.md
          cat table.md >> "$GITHUB_STEP_SUMMARY"
