# @file CT-DEV-008
# cargo-deny policy: allowed licenses, known advisories, and crate sources. CI runs
# `cargo deny check` on every pull request.

[graph]
all-features = true

[advisories]
# Unmaintained and unsound crates fail the check too, not only vulnerabilities.
unmaintained = "all"
yanked = "deny"

[licenses]
# License policy, approved by John on 2026-10-21:
# - Only the licenses in `allow` may ship. cargo-deny fails on any other license.
# - Adding a license to `allow` needs John's approval first, even a permissive one.
#   ed25519-dalek (BSD-3-Clause) needs that approval when it is added.
# - GPL, AGPL, LGPL, and SSPL are never allowed, in `allow` or as an exception.
#   The cargo-deny job in .github/workflows/ci.yml fails if any of them appear here.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93

[licenses.private]
# Our own crates are BUSL-1.1 (LICENSE) and are not published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
