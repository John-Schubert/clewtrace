# @file CT-DEV-009, CT-TRC-008, CT-PLT-001
# Cargo workspace for the Clewtrace core library, the clew CLI, and the desktop app.

[workspace]
resolver = "3"
members = ["crates/clew-core", "crates/clew-cli", "app/src-tauri"]
# Plain `cargo build` and `cargo test` skip the desktop app, which needs the web view
# libraries and a built UI in app/dist. CI builds it with --workspace.
default-members = ["crates/clew-core", "crates/clew-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "BUSL-1.1"
repository = "https://github.com/John-Schubert/clewtrace"
publish = false
