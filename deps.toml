# @file CT-DEV-008
# Every direct third-party dependency: its license, why it exists, and the requirement it
# serves. Indirect crates are covered by the CI license checks and the release SBOM.
# `clew check --self` fails if a direct dependency in a Cargo.toml or package.json is missing
# here. CI tools use ecosystem "ci" and are listed by hand.
# Planned dependencies are listed commented out; uncomment each one when it is first added.

[[dep]]
name = "tauri"
ecosystem = "cargo"
license = "MIT OR Apache-2.0"
serves = ["CT-PLT-001", "CT-EFF-001"]
why = "Desktop shell using the OS web view (ADR-0001). Default features off; wry only"

[[dep]]
name = "tauri-build"
ecosystem = "cargo"
license = "MIT OR Apache-2.0"
serves = ["CT-PLT-001", "CT-SEC-001"]
why = "Build script for the app: reads tauri.conf.json and compiles the capability files. Default features off; config-json only"

