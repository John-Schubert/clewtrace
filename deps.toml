# Indirect crates that need an approved license exception in deny.toml (John, 2026-10-21).
# `scope` says whether the crate ships in a release binary or runs only at build time.

[[dep]]
name = "cssparser"
ecosystem = "cargo"
license = "MPL-2.0"
scope = "build-only"
via = "tauri -> tauri-macros / tauri-codegen / tauri-build -> tauri-utils -> dom_query"
serves = ["CT-PLT-001"]
why = "Indirect: CSS parsing in Tauri's build-time HTML handling"

[[dep]]
name = "cssparser-macros"
ecosystem = "cargo"
license = "MPL-2.0"
scope = "build-only"
via = "tauri-utils -> dom_query -> cssparser"
serves = ["CT-PLT-001"]
why = "Indirect: proc macros for cssparser"

[[dep]]
